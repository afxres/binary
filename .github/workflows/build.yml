name: build
on:
  push:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            10.0.x
            11.0.x

      - name: Setup Environment
        run: bash scripts/setup.sh

      - name: Build Tests
        run: bash scripts/build-tests.sh

      - name: Coverage
        run: bash scripts/run-coverage.sh

      - name: Coveralls
        uses: coverallsapp/github-action@v2
        with:
          fail-on-error: false
          file: "build-result/lcov.info"
